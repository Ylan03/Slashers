name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  GLUALINT_VERSION: "1.29.0"

jobs:
  glualint:
    name: GLua lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install glualint ${{ env.GLUALINT_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/glualint.zip" \
            "https://github.com/FPtje/GLuaFixer/releases/download/${GLUALINT_VERSION}/glualint-${GLUALINT_VERSION}-x86_64-linux.zip"
          unzip -q "$RUNNER_TEMP/glualint.zip" -d "$RUNNER_TEMP/glualint"
          chmod +x "$RUNNER_TEMP/glualint/glualint"
          echo "$RUNNER_TEMP/glualint" >> "$GITHUB_PATH"

      # Blocking: syntax errors, gotos, duplicate table keys (see .glualint.json)
      - name: Lint (blocking)
        run: glualint --output-format github lint gamemode entities

      # Advisory: every glualint rule, only on the Lua files changed by the PR.
      # Shown as annotations in the PR, never fails the job.
      - name: Full lint of changed files (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.lua')
          if [ ${#files[@]} -eq 0 ]; then echo "No Lua file changed."; exit 0; fi
          echo '{}' > "$RUNNER_TEMP/strict.json"
          glualint --config "$RUNNER_TEMP/strict.json" --output-format github lint "${files[@]}"

  languages:
    name: Translation keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare language files with en.lua (advisory)
        run: python3 .github/scripts/check_languages.py
